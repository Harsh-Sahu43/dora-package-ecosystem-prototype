[package]
name = "package-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
semver = "1"
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
registry-client = { path = "../registry-client" }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
