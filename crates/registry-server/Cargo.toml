[package]
name = "registry-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }
anyhow = "1"
flate2 = "1"
tar = "0.4"
toml = "0.8"
semver = "1"
sha2 = "0.10"
hex = "0.4"
registry-client = { path = "../registry-client" }
